# XcodeGen genera el proyecto Xcode a partir de este archivo. Asi no hay que
# versionar el .xcodeproj (que es ruidoso y da conflictos) y la nube de GitHub
# lo reconstruye limpio antes de compilar.
#
#   xcodegen generate    ->    Nexo.xcodeproj

name: Nexo
options:
  bundleIdPrefix: com.nexo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""              # lo rellena la firma (Sideloadly / CI)
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"       # iPhone

targets:
  Nexo:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nexo.camara
        INFOPLIST_FILE: Sources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    info:
      path: Sources/Info.plist
