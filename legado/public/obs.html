<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Salida limpia</title>
    <style>
      /* Sin interfaz: esta pagina es solo la imagen ya corregida, para que OBS
         la capture tal cual. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }

      video {
        display: none;
      }

      canvas {
        width: 100vw;
        height: 100vh;
        display: block;
        object-fit: cover;
      }

      canvas.contener {
        object-fit: contain;
      }

      /* Si no hubiera WebGL, se muestra el video en crudo antes que nada. */
      body.sinGl video {
        display: block;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
      }

      body.sinGl canvas {
        display: none;
      }

      #aviso {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, 'Segoe UI', sans-serif;
        font-size: 15px;
        color: #7c8898;
        background: #0b0d10;
      }

      #aviso.oculto {
        display: none;
      }
    </style>
  </head>
  <body>
    <video id="video" autoplay playsinline muted></video>
    <div id="aviso">Esperando la camara del iPhone…</div>

    <script src="/procesador.js"></script>
    <script src="/decodificador.js"></script>
    <script>
      'use strict';

      const params = new URLSearchParams(location.search);
      const video = document.getElementById('video');
      const aviso = document.getElementById('aviso');

      // OBS controla el audio con "Controlar audio mediante OBS". Por defecto
      // silenciamos para que no se cuele por los altavoces del PC.
      video.muted = params.get('audio') !== '1';

      const procesador = new ProcesadorImagen(video);
      const lienzo = procesador.canvas;
      if (params.get('ajuste') === 'contener') lienzo.classList.add('contener');
      document.body.appendChild(lienzo);
      if (!procesador.disponible) document.body.classList.add('sinGl');

      // Estos dos se pueden fijar por URL; si el estudio manda ajustes, mandan
      // los del estudio, que es donde se esta encuadrando de verdad.
      if (params.get('rotar')) procesador.aplicar({ rotacion: Number(params.get('rotar')) });
      if (params.get('espejo') === '1') procesador.aplicar({ espejo: true });

      // ?formato=9:16 recorta la salida a esa proporcion, centrada. El lienzo
      // pasa a tener ya las dimensiones finales, asi que OBS recibe el encuadre
      // hecho en vez de tener que recortarlo con una transformacion.
      const formato = params.get('formato');
      if (formato && formato.includes(':')) {
        const [a, b] = formato.split(':').map(Number);
        if (a > 0 && b > 0) procesador.recorte = a / b;
      }

      let ws = null;
      let pc = null;
      let reconectar = null;

      // --- Ruta nativa (iPhone por cable) ---------------------------------
      //
      // Por cable el iPhone no participa en la senalizacion WebRTC, asi que
      // aqui no llegaba ninguna pista y OBS se quedaba en negro aunque el
      // estudio estuviera recibiendo imagen. El servidor nos reparte las tramas
      // H.264 tal cual y las decodificamos igual que el estudio.
      let nativoActivo = false;
      let primerNativo = true;
      const decodificador =
        typeof DecodificadorVideo !== 'undefined'
          ? new DecodificadorVideo({
              onFrame: (frame) => {
                const ahora = performance.now();
                if (telemetria.ultimo) {
                  const hueco = ahora - telemetria.ultimo;
                  telemetria.huecoMax = Math.max(telemetria.huecoMax, hueco);
                  // Donde cae el hueco respecto al fotograma clave: antes de
                  // pintarlo, justo despues, o en otro sitio.
                  const esClave = telemetria.clavesTs.delete(frame.timestamp);
                  const campo = esClave ? 'antesClave' : telemetria.previoFueClave ? 'trasClave' : 'otros';
                  telemetria[campo] = Math.max(telemetria[campo], hueco);
                  telemetria.previoFueClave = esClave;
                }
                telemetria.ultimo = ahora;
                telemetria.pintados++;
                ultimoPintado = ahora;
                // El procesador se queda el frame y lo cierra al dibujarlo.
                procesador.ponerFrameExterno(frame);
                if (primerNativo) {
                  procesador.iniciar();
                  aviso.classList.add('oculto');
                  primerNativo = false;
                }
              },
              onError: (e) => {
                console.error('[obs] decoder:', e.message || e);
                // Antes solo se anotaba el error y la imagen se quedaba rota
                // para siempre. Cerrar deja el decodificador listo para
                // recrearse y volver a exigir fotograma clave: la salida se
                // recupera sola en cuanto llegue el siguiente IDR.
                decodificador.cerrar();
              },
            })
          : null;

      function alVideoNativo(datos) {
        if (!decodificador || datos.byteLength < 9) return;
        const vista = new DataView(datos);
        // Mismo formato que el transporte: u64 tiempo, u8 flags, y las NAL.
        const micros = Number(vista.getBigUint64(0));
        const clave = (vista.getUint8(8) & 1) !== 0;
        nativoActivo = true;
        ultimaTrama = performance.now();
        telemetria.llegadas++;
        if (clave || DecodificadorVideo.esFotogramaClave(new Uint8Array(datos, 9))) {
          telemetria.clavesTs.add(micros);
        }
        decodificador.decodificar(new Uint8Array(datos, 9), micros, clave);
      }

      // Vigilante. Si llegan tramas pero no se pinta nada en varios segundos,
      // la pagina se ha quedado colgada: paso el 28/09/2026 tras reiniciar Nexo
      // Desktop varias veces, y la fuente de OBS se quedo en negro hasta pulsar
      // "Actualizar". Se recarga sola, que es justo lo que arreglaba ese boton.
      // Tres fotogramas clave de margen (llegan cada 2 s) para no confundirlo
      // con la espera normal a una clave, y sin llegada no hace nada: el movil
      // en segundo plano no es un cuelgue.
      const PLAZO_COLGADO = 6000;
      let ultimaTrama = 0;
      let ultimoPintado = performance.now();

      // Telemetria hacia el registro de Nexo Desktop, cada 5 s: tramas que
      // llegan, fotogramas pintados y el hueco mas largo entre dos pintados. Es
      // la unica forma de saber si la fuente de OBS va a ritmo, porque no se
      // puede inspeccionar desde fuera.
      const telemetria = {
        llegadas: 0, pintados: 0, huecoMax: 0, ultimo: 0,
        antesClave: 0, trasClave: 0, otros: 0, previoFueClave: false,
        clavesTs: new Set(),
      };
      setInterval(() => {
        if (!telemetria.llegadas) return;
        enviar({
          tipo: 'estadistica',
          origen: 'obs',
          llegadas: telemetria.llegadas,
          pintados: telemetria.pintados,
          huecoMaxMs: telemetria.huecoMax,
          antesClaveMs: telemetria.antesClave,
          trasClaveMs: telemetria.trasClave,
          otrosMs: telemetria.otros,
          visible: document.visibilityState !== 'hidden',
        });
        telemetria.llegadas = 0;
        telemetria.pintados = 0;
        telemetria.huecoMax = 0;
        telemetria.antesClave = 0;
        telemetria.trasClave = 0;
        telemetria.otros = 0;
        // Marcas de claves que nunca salieron (descartadas): no acumularlas.
        if (telemetria.clavesTs.size > 20) telemetria.clavesTs.clear();
      }, 5000);

      setInterval(() => {
        const ahora = performance.now();
        const llegando = ahora - ultimaTrama < 1000;
        // Oculta no es colgada: en segundo plano Chromium estrangula el
        // decodificador y casi no pinta (medido: 7 de 326 tramas en 10 s). Sin
        // esta condicion, el vigilante recargaba una pagina sana.
        if (document.visibilityState === 'hidden') {
          ultimoPintado = ahora;
          return;
        }
        if (!llegando || ahora - ultimoPintado < PLAZO_COLGADO) return;
        // Como mucho una recarga cada 30 s, para no entrar en bucle si el fallo
        // no se va con recargar.
        let ultima = 0;
        try {
          ultima = Number(sessionStorage.getItem('nexo-obs-recarga') || 0);
          if (Date.now() - ultima < 30000) return;
          sessionStorage.setItem('nexo-obs-recarga', String(Date.now()));
        } catch {
          /* sin almacenamiento: se recarga igual */
        }
        console.warn('[obs] llegan tramas pero no se pinta nada: recargando');
        location.reload();
      }, 1000);

      function enviar(m) {
        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(m));
      }

      function cerrar() {
        // Con video nativo en marcha esto no nos incumbe: son restos de la ruta
        // WebRTC, que por cable avisa de que "no hay movil" constantemente.
        if (nativoActivo) {
          if (pc) { pc.ontrack = pc.onicecandidate = null; pc.close(); pc = null; }
          return;
        }
        procesador.parar();
        if (pc) {
          pc.ontrack = pc.onicecandidate = null;
          pc.close();
          pc = null;
        }
        video.srcObject = null;
        aviso.classList.remove('oculto');
      }

      async function atenderOferta(msg) {
        cerrar();
        pc = new RTCPeerConnection({ iceServers: [], bundlePolicy: 'max-bundle' });

        pc.ontrack = (e) => {
          video.srcObject = e.streams[0];
          aviso.classList.add('oculto');
          video.play().finally(() => procesador.iniciar());
        };
        pc.onicecandidate = (e) => {
          if (e.candidate) enviar({ tipo: 'ice', para: msg.de, candidato: e.candidate });
        };

        await pc.setRemoteDescription(msg.sdp);
        await pc.setLocalDescription(await pc.createAnswer());
        enviar({ tipo: 'respuesta', para: msg.de, sdp: pc.localDescription });
      }

      function conectar() {
        ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);

        ws.onopen = () => {
          clearTimeout(reconectar);
          enviar({ tipo: 'hola', rol: 'visor' });
          enviar({ tipo: 'video-nativo', activo: true });
        };
        ws.onclose = () => {
          cerrar();
          reconectar = setTimeout(conectar, 1500);
        };
        ws.onerror = () => ws.close();
        ws.binaryType = 'arraybuffer';
        ws.onmessage = async (evento) => {
          // Las tramas de video llegan en binario; la senalizacion en JSON.
          if (evento.data instanceof ArrayBuffer) return alVideoNativo(evento.data);
          const msg = JSON.parse(evento.data);
          if (msg.tipo === 'oferta') {
            await atenderOferta(msg);
          } else if (msg.tipo === 'ice' && pc && msg.candidato) {
            try {
              await pc.addIceCandidate(msg.candidato);
            } catch {
              /* candidato tardio */
            }
          } else if (msg.tipo === 'imagen' && msg.valores) {
            // Correccion en vivo: lo que tocas en el estudio se ve aqui al
            // instante, sin recargar la fuente de OBS.
            procesador.aplicar(msg.valores);
          } else if (msg.tipo === 'movil-desconectado') {
            cerrar();
          } else if (msg.tipo === 'nexo-sin-sesion') {
            // El iPhone por cable se fue: reiniciar el decodificador para que
            // la proxima vez arranque en un fotograma clave.
            if (decodificador) decodificador.cerrar();
            nativoActivo = false;
            primerNativo = true;
            procesador.parar();
            aviso.classList.remove('oculto');
          }
        };
      }

      conectar();
    </script>
  </body>
</html>
